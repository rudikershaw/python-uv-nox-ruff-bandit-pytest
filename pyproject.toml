[project]
name = "main"
version = "0.1.0"
description = "PROJECT_DESCRIPTION"
readme = "README.md"
authors = [
    { name = "FIRST_NAME LAST_NAME", email = "EMAIL_ADDRESS" }
]
requires-python = ">=3.12"
dependencies = []
license = { text = "MIT" }
keywords = [ ]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "HOMEPAGE_URL"
Repository = "REPOSITORY_URL"
Issues = "ISSUES_URL"

[dependency-groups]
dev = [
    "nox>=2026.04.10",
    "nox-uv>=0.7.1",
]
lint = [
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "pip-audit>=2.10.0",
    "bandit>=1.9.4",
]
test = [
    "pytest>=9.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
branch = true
omit = ["*/tests/*", "*/test_*.py"]
data_file = "reports/.coverage"

[tool.coverage.html]
directory = "reports/htmlcov"

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 98

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_unimported = true

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
    # Formatter-conflicting rules under default space/double-quote settings
    "COM812",
    "COM819",
    "D300",
    # Pydantic needs types imported at runtime.
    "TC001",
    "TC002",
    "TC003",
    # Per file copyright notices are totally redundant.
    "CPY001"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D1",   # Undocumented public definitions in tests
    "S101", # Required by PT009 (pytest-unittest-assertion demands bare assert)
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"
